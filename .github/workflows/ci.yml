name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Roadmap 20 §2 (Phase 1 Q33): Turborepo remote cache (Vercel Remote Cache). Without the
  # secret (forks, a fresh repo) turbo runs uncached as before; a cache miss or an
  # unreachable cache never fails a build. A self-hosted cache also needs TURBO_API here.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      # Phase 8 Q5: the Django export is checked by `manage.py check`; without Django it skips.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "django>=5.2,<6" "psycopg[binary]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm turbo lint typecheck test build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  integration:
    runs-on: ubuntu-latest
    services:
      # Same images and healthchecks as docker-compose.yml, so a CI failure
      # reproduces locally. Compose itself is never used in CI.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schemaloom
          POSTGRES_PASSWORD: schemaloom
          POSTGRES_DB: schemaloom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schemaloom -d schemaloom_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # DATABASE_URL is set to the same value as DATABASE_URL_TEST in this job
      # only, because the Prisma CLI reads DATABASE_URL. There is no dev database
      # in CI to damage.
      DATABASE_URL: postgresql://schemaloom:schemaloom@localhost:5432/schemaloom_test
      DATABASE_URL_TEST: postgresql://schemaloom:schemaloom@localhost:5432/schemaloom_test
      REDIS_URL_TEST: redis://localhost:6379/1
      REDIS_KEY_PREFIX: 'sl-test:'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # migrate deploy, not migrate dev: non-interactive, no drift prompt, no
      # shadow database.
      - run: pnpm --filter @schemaloom/api run db:deploy
      - run: pnpm turbo test:int

  # Doc 01 §8.3. Playwright starts the fake Anthropic server, the api and the web app itself
  # (e2e/playwright.config.ts); this job supplies the services and the env they read. Tests
  # for optional services skip on their own: MARIADB_TEST_URL (workflow 15) isn't set here.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schemaloom
          POSTGRES_PASSWORD: schemaloom
          POSTGRES_DB: schemaloom_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U schemaloom -d schemaloom_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        # The e2e fixture flushes its keys with `docker exec schemaloom-redis-1`, the
        # docker compose name, so the service takes the same name here.
        options: >-
          --name schemaloom-redis-1
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: schemaloom
          MINIO_ROOT_PASSWORD: schemaloom-ci-secret
          MINIO_DEFAULT_BUCKETS: schemaloom
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
          MP_SMTP_DISABLE_RDNS: 1
        ports: ['1025:1025', '8025:8025']
    env:
      # CI-only values for a throwaway stack; nothing here is a real secret. No NODE_ENV:
      # `next build` breaks under development, and Playwright starts the api as production.
      DATABASE_URL_E2E: postgresql://schemaloom:schemaloom@localhost:5432/schemaloom_e2e
      API_PUBLIC_URL: http://localhost:3001
      WEB_PUBLIC_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-e2e-access-secret-000000000000000000000000
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-00000000000000000000000
      CSRF_SECRET: ci-e2e-csrf-secret-0000000000000000000000000000
      SECRETS_ENCRYPTION_KEY: Y2ktZTJlLXNlY3JldHMtZW5jcnlwdGlvbi1rZXktMzI=
      MAIL_FROM: SchemaLoom <no-reply@schemaloom.local>
      SMTP_URL: smtp://localhost:1025
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: schemaloom
      S3_ACCESS_KEY_ID: schemaloom
      S3_SECRET_ACCESS_KEY: schemaloom-ci-secret
    steps:
      # Workflow 18's SSO tests. Service containers can't take a command (`start-dev`), so
      # Keycloak starts here and boots while the apps build.
      - run: >-
          docker run -d --name keycloak -p 8180:8180
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin
          -e KC_HTTP_PORT=8180 quay.io/keycloak/keycloak:26.4 start-dev
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@schemaloom/api --filter=@schemaloom/web
      - run: pnpm --filter @schemaloom/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_E2E }}
      - run: pnpm --filter @schemaloom/e2e exec playwright install --with-deps chromium
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 60); do
            curl -fsS http://localhost:8180/realms/master >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak
          exit 1
      - run: pnpm --filter @schemaloom/e2e test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  # Builds the api image so a change that breaks the Dockerfile fails here, not at deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t schemaloom-api .
