name: schemaloom

# Only the proxy is public. MinIO (file links when running locally) and the Mailpit inbox
# publish on 127.0.0.1. The ports `pnpm dev` needs (Postgres, Redis, SMTP, MinIO console) are
# in docker-compose.dev.yml, which only `pnpm infra:up` adds.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schemaloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schemaloom}
      POSTGRES_DB: ${POSTGRES_DB:-schemaloom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER:-schemaloom} -d ${POSTGRES_DB:-schemaloom}'
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Object storage for avatars and generated export files. The api creates its bucket at
  # boot, so it can't start without this.
  #
  # MinIO stopped publishing to Docker Hub (`minio/minio` now 404s there) and
  # their quay.io registry is not reachable from every network. This uses the
  # Bitnami legacy image, which is on Docker Hub and takes the same
  # MINIO_ROOT_* credentials. If you can reach quay.io, prefer upstream:
  #   image: quay.io/minio/minio:latest
  #   command: ['server', '/data', '--console-address', ':9001']
  #   volumes: [minio-data:/data]
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-schemaloom}
    ports:
      - '127.0.0.1:${MINIO_PORT:-9000}:9000'
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email locally. The app only sends here when neither Mailgun nor APP_SMTP_URL
  # is set in .env, so in production it just sits idle.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # No reverse-DNS lookup of each client: under Docker Desktop it held every SMTP greeting
      # for 8 seconds, so each sign-up, invite and sign-in link took 8 s locally.
      MP_SMTP_DISABLE_RDNS: 1
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  # ─── Roadmap 14: an identity provider for the SSO e2e (workflow 18) ─────────────
  #
  # Test fixture only:  docker compose --profile sso up -d keycloak
  # Empty on every start; the test creates its realm, clients and users through the admin
  # API. Port 8180, because the compose proxy has 8080.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: ['sso']
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    ports:
      - '${KEYCLOAK_TEST_PORT:-8180}:8180'

  # ─── Roadmap 9: MySQL / MariaDB servers for the engine's round-trip tests ──────
  #
  # Test fixtures only, behind a profile so neither `pnpm infra:up` nor `docker compose up`
  # starts them:  docker compose --profile mysql up -d mysql mariadb
  # No volume: every start is an empty server, which is what the tests want.
  mysql:
    image: mysql:8.4
    profiles: ['mysql']
    environment:
      MYSQL_ROOT_PASSWORD: schemaloom
      MYSQL_DATABASE: schemaloom_test
    ports:
      - '${MYSQL_TEST_PORT:-3306}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pschemaloom']
      interval: 5s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.4
    profiles: ['mysql']
    environment:
      MARIADB_ROOT_PASSWORD: schemaloom
      MARIADB_DATABASE: schemaloom_test
    ports:
      - '${MARIADB_TEST_PORT:-3307}:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 30

  # ─── Phase 6 §11: the whole app in Docker (`pnpm app:up`) ─────────────────────
  #
  #   cp .env.example .env            # once; then set the secrets it lists
  #   pnpm app:up                     # builds the images, migrates, starts everything
  #
  # With no APP_URL in .env it serves http://localhost:8080. For a server, set APP_URL,
  # FILES_URL and the two PROXY_*_PORT values (.env.example, "production"): Caddy then gets
  # HTTPS certificates for both hostnames by itself. Jobs (imports, exports, mail) run in `worker`, not the api, so
  # a big import never stalls requests. pg_dump ships in the api image, so "Read a database"
  # works with nothing installed on the host. Only the proxy publishes a port; `pnpm dev` (api
  # :3001, web :3000) runs alongside without clashing, and `pnpm infra:up` starts only the
  # services above. A database on this machine is `host.docker.internal`, not `localhost`,
  # from inside the api container.
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    env_file: .env
    environment: &app-env
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Presigned download/upload URLs are opened by the browser: through the proxy on
      # FILES_URL, or locally on MinIO's published port.
      S3_PUBLIC_URL: ${FILES_URL:-http://localhost:${MINIO_PORT:-9000}}
      # Mailgun in .env wins over this; without it, mail goes to APP_SMTP_URL or Mailpit.
      SMTP_URL: ${APP_SMTP_URL:-smtp://mailpit:1025}
      # One hostname for both, as every deploy requires (docs/deploy.md).
      API_PUBLIC_URL: ${APP_URL:-http://localhost:8080}
      WEB_PUBLIC_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      TRUST_PROXY: '1'
      # A local install reads databases on this machine and network (Phase 6 Q3: self-host
      # opts in). Set false in .env to refuse private addresses.
      INTROSPECT_ALLOW_PRIVATE_HOSTS: ${INTROSPECT_ALLOW_PRIVATE_HOSTS:-true}
      # Cookies stay Secure (the api insists in production); browsers accept them on
      # http://localhost because localhost counts as a secure origin. On any other host,
      # APP_URL must be https.
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      PORT: '3001'
      # Roadmap 20: HTTP and WebSocket only; `worker` runs the jobs. Overrides .env, whose
      # PROCESS_ROLE=all is for `pnpm dev`.
      PROCESS_ROLE: api
      REALTIME_BUS: redis
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Roadmap 20 §1: jobs in their own process (long exports or imports no longer share the
  # api's event loop). More jobs at once:  docker compose up -d --scale worker=3
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file: .env
    environment:
      <<: *app-env
      PROCESS_ROLE: worker
      REALTIME_BUS: redis
    # No HTTP server, so the image's /healthz check doesn't apply.
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle: `pnpm app:up` rebuilds after APP_URL changes.
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      # Server components reach the api directly on the compose network.
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile', '--adapter', 'caddyfile']
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    ports:
      # Same number outside and in: Caddy listens on these (see the Caddyfile's global block).
      # Production sets 80 and 443, which Let's Encrypt needs.
      - '${PROXY_HTTP_PORT:-8080}:${PROXY_HTTP_PORT:-8080}'
      - '${PROXY_HTTPS_PORT:-8443}:${PROXY_HTTPS_PORT:-8443}'
    volumes:
      # Certificates and the ACME account. Without it every restart re-issues them and runs
      # into Let's Encrypt's rate limit.
      - caddy-data:/data
    depends_on:
      - web
      - api

# An https:// site address makes Caddy obtain and renew its certificate; an http:// one
# serves plain HTTP. No `encode`: the api compresses its own responses, and compressing the AI
# assistant's event stream again would buffer it. The files site keeps the Host header, which
# the presigned URLs are signed for. Locally (no FILES_URL) the browser goes to MinIO directly
# and that site is unused.
configs:
  caddyfile:
    content: |
      {
        http_port ${PROXY_HTTP_PORT:-8080}
        https_port ${PROXY_HTTPS_PORT:-8443}
      }
      ${APP_URL:-http://localhost:8080} {
        @api path /api/* /socket.io/*
        reverse_proxy @api api:3001
        reverse_proxy web:3000
      }
      ${FILES_URL:-http://files.localhost:8080} {
        reverse_proxy minio:9000
      }

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  minio-data:
